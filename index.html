<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu Bài Tập Sinh Học 🧬 Lai 2 Tính Trạng</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF8BA7;
            --secondary: #FFC6C7;
            --accent: #C3F0CA;
            --text: #33272A;
            --bg: #FAEEE7;
            --white: #FFFFFE;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--secondary) 100%);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            max-width: 850px;
            width: 100%;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 139, 167, 0.2);
            padding: 40px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        h1, h2 {
            font-family: 'Baloo 2', cursive;
            color: var(--primary);
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            font-weight: 600;
            color: #594A4E;
            margin-bottom: 30px;
            font-size: 1.2em;
            background: var(--secondary);
            padding: 10px;
            border-radius: 15px;
            display: inline-block;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Form nhập liệu */
        .input-group { margin-bottom: 25px; }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary);
            font-size: 1.1em;
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--secondary);
            border-radius: 15px;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
            background: #fffafa;
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 139, 167, 0.3);
            background: white;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, #ff6b8b 100%);
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            font-family: 'Baloo 2', cursive;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 139, 167, 0.4);
        }
        .btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 25px rgba(255, 139, 167, 0.6);
        }

        /* Quiz Header */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            padding: 15px 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            font-weight: bold;
            color: var(--text);
            font-size: 1.1em;
            border: 2px dashed var(--secondary);
        }
        .timer {
            font-size: 22px;
            color: #d63031;
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 8px 18px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-family: 'Baloo 2', cursive;
        }

        /* Questions */
        .question-card {
            background: var(--white);
            border: 2px solid var(--secondary);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            transition: 0.3s;
        }
        .question-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(255, 139, 167, 0.15);
        }
        .question-text {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.6;
            color: var(--text);
        }
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .option {
            background: #fafafa;
            border: 2px solid #e9ecef;
            padding: 16px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            color: #495057;
            display: flex;
            align-items: center;
        }
        .option:hover { 
            border-color: var(--primary); 
            background: var(--bg);
            transform: translateX(5px);
        }
        .option.selected {
            background: var(--secondary);
            border-color: var(--primary);
            color: #b8255b;
        }

        /* Results Display */
        .option.correct-ans {
            background: var(--accent) !important;
            border-color: #28a745 !important;
            color: #155724 !important;
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.2);
        }
        .option.wrong-ans {
            background: #ffd3d6 !important;
            border-color: #dc3545 !important;
            color: #721c24 !important;
        }
        
        .explanation {
            margin-top: 20px;
            background: #fff3f5;
            padding: 20px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.7;
            display: none;
            border-left: 6px solid var(--primary);
            color: var(--text);
        }

        .score-board {
            text-align: center;
            background: linear-gradient(135deg, var(--bg) 0%, var(--accent) 100%);
            padding: 40px;
            border-radius: 25px;
            margin-bottom: 30px;
            color: #2b7a78;
            border: 3px dashed #84dcc6;
        }
        .score-board h1 { 
            color: #2f9c81; 
            font-size: 60px; 
            margin: 15px 0; 
            text-shadow: 2px 2px 0px white;
        }
        
        #loading {
            display: none; 
            text-align: center; 
            font-weight: bold; 
            color: var(--primary); 
            margin-top: 20px;
            font-size: 1.2em;
            font-family: 'Baloo 2';
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- MÀN HÌNH BẮT ĐẦU -->
    <div id="intro-screen" class="screen active">
        <div style="text-align: center; font-size: 4em; margin-bottom: -15px;">🌸🐥🌸</div>
        <h1>PHIẾU BÀI TẬP</h1>
        <div style="text-align: center; width: 100%;"><div class="subtitle">Chủ đề: Lai 2 tính trạng (11 Bài Tập) 🧬</div></div>
        
        <div class="input-group">
            <label>🎀 Tên của bạn là gì nhỉ?</label>
            <input type="text" id="studentName" placeholder="Nhập tên thật đáng yêu của bạn vào đây..." required>
        </div>
        <div class="input-group">
            <label>🏫 Lớp mấy nè?</label>
            <input type="text" id="studentClass" placeholder="Ví dụ: 12A1..." required>
        </div>
        
        <button class="btn" onclick="startQuiz()">Bắt đầu làm bài thôiii 🚀</button>
    </div>

    <!-- MÀN HÌNH LÀM BÀI -->
    <div id="quiz-screen" class="screen">
        <div class="header-bar">
            <div>👩‍🎓 <span id="displayInfo"></span></div>
            <div class="timer">⏳ <span id="timeDisplay">00:00</span></div>
        </div>

        <div id="quiz-container"></div>

        <button class="btn" id="submitBtn" onclick="submitQuiz()">Nộp bài & Xem điểm 🌟</button>
        <div id="loading">Hệ thống đang chấm bài và gửi điểm cho giáo viên, đợi một chút xíu nha... 🎀</div>
    </div>

    <!-- MÀN HÌNH KẾT QUẢ -->
    <div id="result-screen" class="screen">
        <div class="score-board">
            <div style="font-size: 3em;">🎉🏆🎉</div>
            <h2>Tuyệt vời! Bạn đã hoàn thành!</h2>
            <div style="font-size: 1.2em;">Điểm số của bạn:</div>
            <h1 id="scoreDisplay">10/10</h1>
            <div style="font-size: 1.2em;">Thời gian làm bài: <strong id="resultTime">00:00</strong> ⏱️</div>
        </div>
        
        <h3 style="text-align: center; color: var(--primary); font-family: 'Baloo 2'; font-size: 2em;">📝 XEM LẠI ĐÁP ÁN & LỜI GIẢI 📝</h3>
        <div id="review-container"></div>
    </div>
</div>

<script>
    // Dữ liệu 11 câu hỏi được chuyển đổi sang dạng trắc nghiệm
    const questions = [
        {
            q: "<b>Bài 1:</b> Phép lai 1: cho 12 cây cà chua lai với nhau, thu được F1: 75% cây quả đỏ, bầu dục; 25% quả vàng, bầu dục. Phép lai 2: thu được 75% quả vàng, tròn; 25% quả vàng, bầu dục. Tính trạng nào là trội hoàn toàn?",
            options: [
                "Quả đỏ, quả bầu dục",
                "Quả vàng, quả tròn",
                "Quả đỏ, quả tròn",
                "Quả vàng, quả bầu dục"
            ],
            correct: 2,
            explanation: "<b>Hướng dẫn:</b><br>- Từ PL 1: Đỏ : Vàng = 3 : 1 => Đỏ là trội so với vàng.<br>- Từ PL 2: Tròn : Bầu dục = 3 : 1 => Tròn là trội so với bầu dục.<br>Vậy tính trạng trội là: <b>Quả đỏ, quả tròn</b>."
        },
        {
            q: "<b>Bài 2:</b> Cho 1 cá thể F1 dị hợp lai với cá thể thứ nhất được đời con có 6,25% kiểu hình cây thấp, hạt dài. Biết mỗi gen quy định 1 tính trạng, cây cao, hạt tròn là trội hoàn toàn. Kiểu gen của F1 và cá thể thứ nhất là gì?",
            options: [
                "AaBb x aabb",
                "AaBb x Aabb",
                "AaBb x AaBb",
                "Aabb x aaBb"
            ],
            correct: 2,
            explanation: "<b>Hướng dẫn:</b><br>- Tỉ lệ cây thấp, hạt dài (lặn 2 tính trạng aabb) = 6,25% = 1/16.<br>- Để tạo ra 1/16 aabb, cả F1 và cá thể thứ 1 đều phải tạo giao tử ab với tỉ lệ 1/4.<br>=> F1 và cá thể thứ nhất đều có kiểu gen dị hợp 2 cặp gen: <b>AaBb x AaBb</b>."
        },
        {
            q: "<b>Bài 3:</b> Ở ruồi giấm thân xám (A) là trội hoàn toàn so với thân đen (a), lông ngắn (B) trội hoàn toàn so với lông dài (b). Các gen nằm trên các NST thường khác nhau. Số kiểu gen và kiểu hình tối đa có thể có trong quần thể là:",
            options: [
                "4 kiểu gen, 4 kiểu hình",
                "9 kiểu gen, 4 kiểu hình",
                "9 kiểu gen, 6 kiểu hình",
                "6 kiểu gen, 4 kiểu hình"
            ],
            correct: 1,
            explanation: "<b>Hướng dẫn:</b><br>- Tính trạng thân: có 3 kiểu gen (AA, Aa, aa) và 2 kiểu hình (Xám, Đen).<br>- Tính trạng lông: có 3 kiểu gen (BB, Bb, bb) và 2 kiểu hình (Ngắn, Dài).<br>=> Số tổ hợp KG = 3 x 3 = <b>9 kiểu gen</b>.<br>=> Số tổ hợp KH = 2 x 2 = <b>4 kiểu hình</b>."
        },
        {
            q: "<b>Bài 4:</b> Ở ruồi giấm, phép lai 1 (Đen, ngắn x Đen, ngắn) thu được đời con gồm: 89 Đen, ngắn : 31 Đen, dài : 29 Trắng, ngắn : 11 Trắng, dài. Kiểu gen của phép lai này là:",
            options: [
                "AaBb x AaBb",
                "AaBb x aabb",
                "Aabb x aaBb",
                "AaBb x Aabb"
            ],
            correct: 0,
            explanation: "<b>Hướng dẫn:</b><br>- Tỉ lệ phân li kiểu hình xấp xỉ 9 : 3 : 3 : 1.<br>- Đây là kết quả của phép lai 2 cơ thể dị hợp tử về 2 cặp gen phân li độc lập.<br>=> Kiểu gen: <b>AaBb x AaBb</b>."
        },
        {
            q: "<b>Bài 5:</b> Ở đậu Hà Lan, hạt vàng (A) trội so với xanh (a); trơn (B) trội so với nhăn (b). Cho đậu vàng, trơn thuần chủng lai với xanh, nhăn thu được F1. F1 có kiểu gen là gì?",
            options: [
                "AABB",
                "aabb",
                "AaBb",
                "AABb"
            ],
            correct: 2,
            explanation: "<b>Hướng dẫn:</b><br>- P thuần chủng: Vàng, trơn (AABB) x Xanh, nhăn (aabb).<br>- Giao tử P: AB x ab.<br>=> Kiểu gen F1: <b>AaBb</b> (100% vàng, trơn)."
        },
        {
            q: "<b>Bài 6:</b> Cho 2 giống đậu thuần chủng thân cao, hoa đỏ lai với thân thấp, hoa trắng. F1 thu được toàn thân cao, hoa đỏ. Làm thế nào để biết một cây đậu thân cao, hoa đỏ ở thế hệ sau có thuần chủng hay không?",
            options: [
                "Cho lai phân tích",
                "Cho tự thụ phấn",
                "Cả lai phân tích và tự thụ phấn đều được",
                "Lai với F1"
            ],
            correct: 2,
            explanation: "<b>Hướng dẫn:</b><br>Để kiểm tra kiểu gen của một cá thể mang tính trạng trội (xem có thuần chủng không), ta có thể dùng <b>phép lai phân tích</b> (lai với cá thể mang tính trạng lặn) hoặc ở thực vật có thể cho <b>tự thụ phấn</b>. Nếu đời con đồng tính thì thuần chủng, phân tính thì không thuần chủng."
        },
        {
            q: "<b>Bài 7:</b> Cho 2 giống đậu thuần chủng vàng, trơn lai với xanh, nhăn. F1 thu được đem tự thụ phấn, F2 thu được 184 vàng trơn, 59 vàng nhăn, 63 xanh trơn, 31 xanh nhăn. Tỉ lệ kiểu hình F2 xấp xỉ là:",
            options: [
                "1 : 1 : 1 : 1",
                "3 : 1",
                "9 : 3 : 3 : 1",
                "3 : 3 : 1 : 1"
            ],
            correct: 2,
            explanation: "<b>Hướng dẫn:</b><br>- Tổng số cây F2: 184 + 59 + 63 + 31 = 337.<br>- Tỉ lệ: (184/337) : (59/337) : (63/337) : (31/337) ≈ <b>9 : 3 : 3 : 1</b>."
        },
        {
            q: "<b>Bài 8:</b> Giao phấn hai cây đậu F1 thu được 176 cao tròn : 58 cao dài : 60 thấp tròn : 21 thấp dài. Nếu đem 1 cây cao, tròn (AaBb) lai phân tích thì tỉ lệ kiểu hình đời con là:",
            options: [
                "9 : 3 : 3 : 1",
                "1 : 1 : 1 : 1",
                "3 : 1",
                "1 : 1"
            ],
            correct: 1,
            explanation: "<b>Hướng dẫn:</b><br>- Đời con thu được tỉ lệ 9:3:3:1 => 2 cây P đều có KG AaBb (cao, tròn).<br>- Phép lai phân tích: AaBb x aabb.<br>=> Đời con Fa: 1 AaBb : 1 Aabb : 1 aaBb : 1 aabb.<br>=> Tỉ lệ KH: <b>1 : 1 : 1 : 1</b>."
        },
        {
            q: "<b>Bài 9:</b> Cho cây có kiểu gen AABBCCEE x aabbccee thu được F1. Cho F1 giao phấn với nhau (AaBbCcEe x AaBbCcEe). Số kiểu gen và số tổ hợp tối đa thu được ở F2 lần lượt là:",
            options: [
                "81 kiểu gen và 256 tổ hợp",
                "256 kiểu gen và 81 tổ hợp",
                "64 kiểu gen và 256 tổ hợp",
                "81 kiểu gen và 64 tổ hợp"
            ],
            correct: 0,
            explanation: "<b>Hướng dẫn:</b><br>- F1 có 4 cặp gen dị hợp (AaBbCcEe). Giao phấn F1 x F1.<br>- Số loại giao tử = 2^4 = 16.<br>- Số tổ hợp F2 = 16 x 16 = <b>256</b>.<br>- Số loại kiểu gen F2 = 3^4 = <b>81</b>."
        },
        {
            q: "<b>Câu 10:</b> Cho cây đậu hoa đỏ, hạt vàng, vỏ trơn lai với cây đậu hoa trắng, hạt xanh, vỏ nhăn thu được F1 toàn đỏ, vàng, trơn. Cho F1 tự thụ phấn, tính theo lý thuyết, tỉ lệ cây hoa đỏ, hạt vàng, vỏ trơn (A-B-C-) ở F2 là:",
            options: [
                "9/64",
                "1/64",
                "27/64",
                "3/64"
            ],
            correct: 2,
            explanation: "<b>Hướng dẫn:</b><br>- F1 dị hợp 3 cặp gen (AaBbCc) tự thụ phấn.<br>- Xét riêng từng cặp gen (Aa x Aa -> 3/4 A- : 1/4 aa).<br>- Tỉ lệ kiểu hình trội về 3 tính trạng (A-B-C-) = 3/4 x 3/4 x 3/4 = <b>27/64</b>."
        },
        {
            q: "<b>Câu 11:</b> Cho cây có kiểu gen AaBbCcDd tự thụ phấn. Biết mỗi gen nằm trên 1 NST. Tính theo lý thuyết, tỉ lệ cây có kiểu gen AABbCcdd ở đời con là:",
            options: [
                "4/256",
                "8/256",
                "1/256",
                "16/256"
            ],
            correct: 0,
            explanation: "<b>Hướng dẫn:</b><br>- Tự thụ phấn: AaBbCcDd x AaBbCcDd.<br>- Tỉ lệ AA từ Aa x Aa = 1/4.<br>- Tỉ lệ Bb từ Bb x Bb = 2/4.<br>- Tỉ lệ Cc từ Cc x Cc = 2/4.<br>- Tỉ lệ dd từ Dd x Dd = 1/4.<br>=> Tỉ lệ AABbCcdd = 1/4 x 2/4 x 2/4 x 1/4 = <b>4/256</b>."
        }
    ];

    let timerInterval;
    let seconds = 0;
    let studentName = '';
    let studentClass = '';
    let userAnswers = new Array(questions.length).fill(null);
    let isSubmitted = false;

    // API Của Google Sheet
    const API_URL = "https://script.google.com/macros/s/AKfycbwebyo0Wkgkq_PbpD7QtxO7dIiFVa1n4gXkJ9ckfrNaIqylw7fTSbhSx_JzAO4sBnvN/exec";

    function startQuiz() {
        studentName = document.getElementById('studentName').value.trim();
        studentClass = document.getElementById('studentClass').value.trim();

        if (!studentName || !studentClass) {
            alert('Bạn nhớ nhập Tên và Lớp trước khi làm bài nha! 🐥💖');
            return;
        }

        document.getElementById('intro-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        document.getElementById('displayInfo').innerText = `${studentName} - Lớp ${studentClass}`;

        renderQuestions();
        startTimer();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            seconds++;
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${m}:${s}`;
        }, 1000);
    }

    function renderQuestions() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        
        questions.forEach((q, qIndex) => {
            let card = document.createElement('div');
            card.className = 'question-card';
            
            let title = document.createElement('div');
            title.className = 'question-text';
            title.innerHTML = q.q;
            card.appendChild(title);

            let optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            optionsDiv.id = `options-${qIndex}`;

            q.options.forEach((opt, optIndex) => {
                let btn = document.createElement('div');
                btn.className = 'option';
                btn.innerHTML = `<b>${String.fromCharCode(65 + optIndex)}.</b> &nbsp; ${opt}`; 
                btn.onclick = () => selectOption(qIndex, optIndex);
                optionsDiv.appendChild(btn);
            });

            card.appendChild(optionsDiv);
            
            // Khối giải thích (ẩn đi)
            let expDiv = document.createElement('div');
            expDiv.className = 'explanation';
            expDiv.id = `exp-${qIndex}`;
            expDiv.innerHTML = q.explanation;
            card.appendChild(expDiv);

            container.appendChild(card);
        });
    }

    function selectOption(qIndex, optIndex) {
        if (isSubmitted) return;
        userAnswers[qIndex] = optIndex;
        let options = document.getElementById(`options-${qIndex}`).children;
        for (let i = 0; i < options.length; i++) {
            options[i].classList.remove('selected');
        }
        options[optIndex].classList.add('selected');
    }

    function submitQuiz() {
        if (userAnswers.includes(null)) {
            let confirmSubmit = confirm('Bạn chưa làm hết các câu hỏi. Vẫn muốn nộp bài chứ? 🥺');
            if (!confirmSubmit) return;
        }

        isSubmitted = true;
        clearInterval(timerInterval);
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        let correctCount = 0;
        let chiTiet = "";

        // Chấm bài
        questions.forEach((q, i) => {
            let options = document.getElementById(`options-${i}`).children;
            let userAnswer = userAnswers[i];
            
            for(let opt of options) { 
                opt.style.cursor = 'default'; 
            }

            if (userAnswer === q.correct) {
                correctCount++;
                if (userAnswer !== null) options[userAnswer].classList.add('correct-ans');
                chiTiet += `Câu ${i+1}: Đúng | `;
            } else {
                if (userAnswer !== null) options[userAnswer].classList.add('wrong-ans');
                options[q.correct].classList.add('correct-ans');
                chiTiet += `Câu ${i+1}: Sai | `;
            }
            
            // Hiện lời giải
            document.getElementById(`exp-${i}`).style.display = 'block';
        });

        // Tính thang điểm 10
        let diemSo = (correctCount / questions.length) * 10;
        let timeTaken = document.getElementById('timeDisplay').innerText;

        // Chuẩn bị payload gửi về Google Sheet
        const payload = {
            Thoigian: timeTaken,
            Chude: "Lai 2 tính trạng (11 Câu)",
            hoTen: studentName,
            lop: studentClass,
            diemSo: diemSo.toFixed(2),
            chiTiet: chiTiet.slice(0, -3)
        };

        // Gửi API
        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        }).then(() => {
            showFinalResult(diemSo, timeTaken);
        }).catch((err) => {
            console.error('Lỗi khi gửi API:', err);
            // Vẫn hiện điểm cho học sinh nếu mạng lỗi
            showFinalResult(diemSo, timeTaken);
        });
    }

    function showFinalResult(diemSo, timeTaken) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        
        document.getElementById('scoreDisplay').innerText = diemSo.toFixed(1) + " / 10";
        document.getElementById('resultTime').innerText = timeTaken;
        
        // Chuyển toàn bộ khung câu hỏi sang trang kết quả để xem lại
        let quizContainer = document.getElementById('quiz-container');
        document.getElementById('review-container').appendChild(quizContainer);
    }
</script>
